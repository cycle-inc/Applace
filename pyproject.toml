[project]
name = "applace"
version = "0.1.0"
description = "Build, preview and ship web apps from any LLM agent."
readme = "README.md"
authors = [{ name = "Applace contributors" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "agents", "codegen", "vibe-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12",
    "typer>=0.12",
]

[project.optional-dependencies]
# The eyes (D5). Kept out of the base install because a browser is 150 MB and a
# harness that only builds and pushes does not need one: `uvx applace` stays
# small, and `applace init` says what is missing and how to get it.
eyes = ["playwright>=1.49"]

[project.urls]
Homepage = "https://github.com/cycle-inc/Applace"
Repository = "https://github.com/cycle-inc/Applace"
Issues = "https://github.com/cycle-inc/Applace/issues"

[project.scripts]
applace = "applace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.390",
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_npm: requires npm on PATH and a working network, and takes tens of seconds",
    "needs_browser: requires a chromium installed by `playwright install chromium`",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.uv]
# The built-in stack template is package data, not Python. Nothing imports it.
package = true
