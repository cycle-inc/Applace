name: acme-web
title: Acme internal web app
description: >
  The stack Acme's internal tools are built from: the Acme design system in
  src/ui, the authenticated Acme API client in src/lib/acme.ts, and the house
  rules already in the linter. Apps start from a page that uses all three, so an
  agent has an example of the company's own components rather than a blank file.
runtime: node
commands:
  install: npm install
  dev: npm run dev -- --port {port} --strictPort --host 127.0.0.1
  typecheck: npm run typecheck
  lint: npm run lint
  build: npm run build
manifest: package.json
dist: dist
env_prefix: VITE_
entry: src/App.tsx
# Nothing here for `applace take` to recognise (D26), and that is the honest
# answer for this example: its design system is vendored into template/src/ui
# rather than installed, so an app built from it depends on nothing that the
# generic stack's apps do not. A company whose design system is a package adds
#   recognise:
#     dependencies: [vite, react, '@acme/ui']
# and every repository using it is claimed by this stack rather than by the
# generic one. A stack that claims nothing is never recognised, which is why
# `take` refuses instead of guessing.
deploy:
  - local
  - vercel
